[package]
name = "stackly-core"
description = "Stackly use cases that run on top of the domain and the platform ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
stackly-domain.workspace = true
stackly-platform.workspace = true
regex.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror.workspace = true

[features]
# The JSON Schemas of the provider package files, generated by `cargo xtask
# codegen` into `schemas/provider/` (spec 0009). Off by default.
json-schema = ["dep:schemars"]

[dev-dependencies]
stackly-testkit.workspace = true

[lints]
workspace = true
