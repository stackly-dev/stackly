[package]
name = "stackly-core"
description = "Stackly use cases that run on top of the domain and the platform ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flate2.workspace = true
getrandom.workspace = true
jiff.workspace = true
object.workspace = true
stackly-domain.workspace = true
stackly-platform.workspace = true
regex.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
socket2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tracing.workspace = true
zip.workspace = true

[features]
# The JSON Schemas of the provider package files, generated by `cargo xtask
# codegen` into `schemas/provider/` (spec 0009). Off by default.
json-schema = ["dep:schemars"]
# `ResolvedSecrets::for_tests` (spec 0011), for dev dependencies and
# integration tests only. Never on in a release build.
test-support = []

[dev-dependencies]
stackly-core = { workspace = true, features = ["test-support"] }
stackly-evidence.workspace = true
stackly-testkit.workspace = true
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "net",
    "io-util",
    "test-util",
] }

[lints]
workspace = true
