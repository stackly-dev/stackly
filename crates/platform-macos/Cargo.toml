[package]
name = "stackly-platform-macos"
description = "macOS implementation of the Stackly platform traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Lets MacosFetcher speak plain HTTP to a loopback server. Only dev
# dependencies turn it on (spec 0018).
loopback-http = []

[dependencies]
core-foundation.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-service-management.workspace = true
security-framework.workspace = true
stackly-domain.workspace = true
stackly-platform.workspace = true
thiserror.workspace = true
ureq.workspace = true

[dev-dependencies]
rustls.workspace = true
serde_json.workspace = true
stackly-core.workspace = true
stackly-testkit.workspace = true

# The integration tests turn the loopback feature on (spec 0018).
[target.'cfg(target_os = "macos")'.dev-dependencies]
stackly-platform-macos = { workspace = true, features = ["loopback-http"] }

[lints]
workspace = true
