# cargo-deny settings: licenses, RustSec advisories, bans, and sources.
# This is the dependency gate for PRD 27 (spec 0001). Run `cargo deny check`.

[graph]
# Every target Stackly builds or checks: the Mac app and the Windows
# portability check.
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
]

[advisories]
# Fail on any RustSec vulnerability, on unmaintained crates anywhere in the
# graph, and on yanked versions. Add an ignore only with a reason and an owner.
unmaintained = "all"
yanked = "deny"
ignore = [
    # Owner: feature 9 (provider engine). serde_yaml_ng, the YAML crate of
    # spec 0001, runs on unsafe-libyaml 0.2.11, archived upstream in 2024.
    # The advisory is informational (unmaintained), not a vulnerability. The
    # user chose to keep serde_yaml_ng (2026-10-18): provider.yaml is capped
    # at 256 KiB, nested aliases fail fast (billion laughs test in
    # stackly-core), and the manifest parser is fuzzed (spec 0009 AC-16).
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml under serde_yaml_ng is unmaintained, kept by user decision; owner feature 9" },
]

[licenses]
# Stackly is `MIT OR Apache-2.0`; only permissive licenses may enter the graph.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # Only libfuzzer-sys (LLVM libFuzzer) uses it, and it enters only through
    # the fuzz/ project, never a shipped binary (spec 0006, Fuzzing).
    "NCSA",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; they are never published.
allow-wildcard-paths = true
# Known duplicates while the ecosystem moves to a new major. Drop an entry
# once the old version leaves Cargo.lock.
skip = [
    { crate = "syn:<3", reason = "proc macros are moving from syn 2 to syn 3" },
    { crate = "winnow:<1", reason = "toml 0.9 still uses winnow 0.7 next to toml_parser on 1.x" },
]
deny = [
    { crate = "serde_yml", reason = "RUSTSEC-2025-0068; use serde_yaml_ng (spec 0001)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
