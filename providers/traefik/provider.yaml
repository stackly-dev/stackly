apiVersion: stackly/v1alpha1
kind: Provider
metadata:
  id: official/traefik
  software: traefik
  displayName: Traefik Proxy
  revision: "1.0.0"
  category: proxy
  description: Traefik reverse proxy for local services, with routes kept in a watched dynamic file.
compatibility:
  platforms:
    - { os: macos, arch: aarch64 }
runtime:
  executable: traefik
  executionMode: foreground
  versionCheck:
    args: ["version"]
    pattern: '^Version:\s+([0-9]+\.[0-9]+\.[0-9]+)$'
    timeoutSeconds: 10
capabilities:
  reload: true
  multiInstance: true
resources:
  endpoints:
    web: { transport: tcp, purpose: client, defaultHost: "127.0.0.1", defaultPort: 8000 }
    ping: { transport: tcp, purpose: monitoring, defaultHost: "127.0.0.1", defaultPort: 8082 }
configFiles:
  staticConfig:
    template: templates/traefik.yaml.tmpl
    format: yaml
    destination: "${instance.config}/traefik.yaml"
  routes:
    template: templates/routes.yaml.tmpl
    format: yaml
    destination: "${instance.config}/dynamic/routes.yaml"
lifecycle:
  initialize:
    - { primitive: createManagedDirectories }
    - { primitive: renderConfig, file: routes }
  start:
    executable: "${runtime.executable}"
    args: ["--configFile=${instance.config}/traefik.yaml"]
    cwd: "${instance.data}"
  stop: { strategy: gracefulProcess, signal: term }
  reload:
    render: [routes]
    action: none
    verify: readiness
readiness:
  probe:
    type: native
    name: traefik-routes
    endpoint: ping
    params: { routesFile: "${instance.config}/dynamic/routes.yaml" }
timeouts: { readinessSeconds: 30, stopSeconds: 30, reloadSeconds: 30 }
permissions:
  managedFilesystem: [data, config, logs, temp]
  executeRuntimeBinary: true
connection:
  - name: web
    title: Web URL
    template: "http://${endpoint.web.address}"
  - name: ping
    title: Health URL
    template: "http://${endpoint.ping.address}/ping"
openWith:
  - name: routes
    title: Routes File
    kind: reveal
    reveal:
      configFile: routes
  - name: routers
    title: Loaded Routers
    kind: browser
    browser:
      url: "http://${endpoint.ping.address}/api/http/routers"
remedies:
  - name: routes_not_loaded
    when:
      readinessReasons: [routes_mismatch]
    title: "Traefik hasn’t loaded the routes Stackly wrote"
    steps:
      - text: "Open the Logs tab. Traefik logs the router it rejected and why, usually a rule it can’t parse."
      - text: "Fix the rule in Configuration and apply again, or roll back to the last revision that was ready."
      - text: "A file you added to this folder also causes this, when it holds a router or Traefik can’t read it. Move that file out of the folder."
        path: "${instance.config}/dynamic"
