# Stackly CI, as spec 0001 describes it.
#
# Fixture jobs (every pull request, hosted runners):
#   linux        fmt, clippy, tests, dependency and runtime inventory rules,
#                portability check
#   contract     generated Swift types and JSON Schemas match stackly-protocol
#   deny         cargo-deny: licenses, RustSec advisories, bans, sources
#   macos-rust   Rust on darwin, including stackly-platform-macos
# Self hosted macOS 27 Mac (trusted branches only, never fork pull requests,
# and only when the repository variable SELF_HOSTED_MACOS27 is `true`):
#   macos-swift  swift-format, Swift contract tests, the app build
# Real runtime jobs also run on the self hosted Mac, in their own job, once
# the first native runtime test exists.
#
# No job remaps source paths: the Swift fixture tests find protocols/fixtures
# through #filePath.
#
# Tests run through `cargo xtask evidence run` (spec 0002): tests that prove a
# PRD ID write evidence records, and each job uploads target/evidence/ as an
# artifact, even when the tests fail.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep in step with TYPESHARE_CLI_VERSION in xtask/src/codegen.rs.
  TYPESHARE_CLI_VERSION: 1.13.4
  CARGO_DENY_VERSION: 0.20.2
  # The pinned Xcode for the self hosted Mac (Swift 6.4, macOS 27 SDK).
  XCODE_VERSION: "27.0"

jobs:
  linux:
    name: Linux (fmt, clippy, test, portability)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --exclude stackly-platform-macos --all-targets --locked -- -D warnings
      - name: Tests (as fixture evidence)
        run: cargo xtask evidence run --kind fixture -- cargo test --workspace --exclude stackly-platform-macos --locked --no-fail-fast
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-linux
          path: target/evidence/
      - name: Dependency direction and unsafe rules
        run: cargo xtask check-deps
      - name: Runtime inventory and evidence rules (spec 0003)
        run: cargo xtask runtime check
      - name: Portable crates build natively
        run: cargo check --locked -p stackly-domain -p stackly-platform -p stackly-protocol -p stackly-core
      - name: Portable crates build for Windows
        run: cargo check --locked --target aarch64-pc-windows-msvc -p stackly-domain -p stackly-platform -p stackly-protocol -p stackly-core
      - name: Daemon and CLI compile off macOS (Windows)
        run: cargo clippy --locked --target aarch64-pc-windows-msvc -p stacklyd -p stackly-cli -- -D warnings

  contract:
    name: Contract codegen up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install typeshare-cli
        # A no op when the cached ~/.cargo/bin already has this version.
        run: cargo install --locked typeshare-cli --version "$TYPESHARE_CLI_VERSION"
      - name: Generated files match stackly-protocol
        run: cargo xtask codegen --check

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Licenses, advisories, bans, and sources
        run: cargo deny --locked check

  macos-rust:
    name: macOS Rust (darwin)
    # Hosted Xcode 26 cannot build the macOS 27 app, so this job is Rust only.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (as fixture evidence)
        run: cargo xtask evidence run --kind fixture -- cargo test --workspace --locked --no-fail-fast
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-macos-rust
          path: target/evidence/

  macos-swift:
    name: macOS 27 Swift (self hosted)
    # The self hosted Mac never runs code from a fork and never holds signing
    # secrets. The job is skipped until the repository variable
    # SELF_HOSTED_MACOS27 is set to `true` (Settings > Secrets and variables >
    # Actions > Variables), so a missing runner never leaves a run queued and
    # blocking the concurrency group. Unset it while the Mac is offline.
    if: >-
      vars.SELF_HOSTED_MACOS27 == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, macos-27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the pinned Xcode
        run: |
          xcodebuild -version
          swift --version
          if ! xcodebuild -version | grep -qx "Xcode $XCODE_VERSION"; then
            echo "::error::this job needs Xcode $XCODE_VERSION, select it with xcode-select"
            exit 1
          fi
      - name: swift-format lint
        run: git ls-files -z -- '*.swift' ':(exclude)**/Generated/**' | xargs -0 xcrun swift-format lint --strict
      - name: Swift contract tests
        run: swift test --package-path clients/swift
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build the app
        run: cargo xtask build-app
