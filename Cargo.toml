[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/platform",
    "crates/protocol",
    "crates/core",
    "crates/platform-macos",
    "crates/testkit",
    "crates/evidence",
    "apps/daemon",
    "apps/cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ojiepermana/stackly"
publish = false

[workspace.dependencies]
# Stackly crates
stackly-core = { path = "crates/core" }
stackly-domain = { path = "crates/domain" }
stackly-evidence = { path = "crates/evidence" }
stackly-platform = { path = "crates/platform" }
stackly-platform-macos = { path = "crates/platform-macos" }
stackly-protocol = { path = "crates/protocol" }
stackly-testkit = { path = "crates/testkit" }

# Third party
anyhow = "1.0"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
sha2 = "0.11"
syn = { version = "3.0", features = ["full", "visit"] }
tempfile = "3"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
typeshare = "1.0"
uuid = { version = "1.28", features = ["v7", "serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "packed"
