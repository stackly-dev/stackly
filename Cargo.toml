[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/platform",
    "crates/protocol",
    "crates/core",
    "crates/platform-macos",
    "crates/testkit",
    "crates/evidence",
    "crates/fake-server",
    "crates/storage",
    "crates/ipc",
    "apps/daemon",
    "apps/cli",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ojiepermana/stackly"
publish = false

[workspace.dependencies]
# Stackly crates
stackly-core = { path = "crates/core" }
stackly-domain = { path = "crates/domain" }
stackly-evidence = { path = "crates/evidence" }
stackly-ipc = { path = "crates/ipc" }
stackly-platform = { path = "crates/platform" }
stackly-platform-macos = { path = "crates/platform-macos" }
stackly-protocol = { path = "crates/protocol" }
stackly-storage = { path = "crates/storage" }
stackly-testkit = { path = "crates/testkit" }

# Third party
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
core-foundation = "0.10"
ctrlc = { version = "3.5", features = ["termination"] }
# Pure Rust deflate (miniz_oxide) for the runtime extractor (spec 0018).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
# Mach-O headers and load commands only, for the runtime closure check
# (spec 0018).
object = { version = "0.40", default-features = false, features = ["read_core", "macho", "std"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
regex = "1.13"
rpassword = "7.5"
# A TLS server for the fetcher test that refuses an unknown certificate
# (spec 0018); the same version ureq already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
schemars = "1.2"
security-framework = "3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
signal-hook = "0.4"
socket2 = "0.6"
syn = { version = "3.0", features = ["full", "visit"] }
# Read only: no xattr restore, no unpack (spec 0018).
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2.0"
tokio = "1.53"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
typeshare = "1.0"
unicode-width = "0.2"
# HTTPS client for runtime downloads: rustls with the macOS trust store, no
# automatic decompression, no cookies (spec 0018).
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
uuid = { version = "1.28", features = ["v7", "serde"] }
zeroize = "1.9"
# Stored and deflate entries only, decompressed through flate2 (spec 0018).
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "packed"
