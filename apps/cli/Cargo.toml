[package]
name = "stackly-cli"
description = "The Stackly command line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "stackly"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
clap = { workspace = true, features = ["string"] }
clap_complete.workspace = true
clap_mangen.workspace = true
jiff.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
stackly-ipc.workspace = true
stackly-platform.workspace = true
stackly-protocol.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
unicode-width.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
stackly-platform-macos.workspace = true

[dev-dependencies]
regex.workspace = true
tempfile.workspace = true
serde_json.workspace = true
stackly-evidence.workspace = true
stackly-testkit.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
