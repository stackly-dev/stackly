[package]
name = "stacklyd"
description = "The per user Stackly daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
stackly-core.workspace = true
stackly-domain.workspace = true
stackly-ipc.workspace = true
stackly-platform.workspace = true
stackly-protocol.workspace = true
stackly-storage.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
stackly-platform-macos.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
stackly-testkit.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "test-util"] }

[lints]
workspace = true
